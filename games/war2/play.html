<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<link rel="icon" href="data:," />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>war2 · play</title>
	<style>
		/* One player per window: the game fills it. (index.html is the harness: every player of a match in one tab.) */
		:root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
		html, body { height: 100%; margin: 0; }
		body { display: flex; flex-direction: column; background: #0b0e11; color: #d7dde4; overflow: hidden; }
		header { position: relative; display: flex; gap: 16px; align-items: baseline; padding: 6px 12px; flex: 0 0 auto; }
		h1 { margin: 0; font-size: 14px; }
		#summary, #role { color: #8a96a3; font-size: 12px; }
		#invite { color: #7fb0ff; font-size: 12px; }
		#instances { flex: 1 1 auto; min-height: 0; display: flex; }
		iframe { flex: 1 1 auto; width: 100%; height: 100%; border: 0; background: #05070a; }
		/* The host's view of every client's sync, folded away off the header. */
		#status-panel { margin-left: auto; font-size: 12px; color: #8a96a3; }
		#status-panel summary { cursor: pointer; }
		#status-panel[open] table { position: absolute; right: 12px; top: 100%; z-index: 2; background: rgba(11, 14, 17, 0.95); border: 1px solid #243040; border-radius: 6px; }
		body[data-role="player"] #status-panel { display: none; }
		table { border-collapse: collapse; font: 12px ui-monospace, monospace; }
		th, td { padding: 4px 10px; text-align: right; border-bottom: 1px solid #1c242e; }
		th:first-child, td:first-child { text-align: left; }
		tr[data-state="in sync"] td:nth-child(4) { color: #9fe6b8; }
		tr[data-state="OUT OF SYNC"] td:nth-child(4) { color: #ff8a7a; font-weight: bold; }
		tr[data-state="behind"] td:nth-child(4), tr[data-state="joining"] td:nth-child(4) { color: #f5b83d; }
		tr[data-state="stalled"] td { color: #6b7684; }
		tr[data-state="stalled"] td:nth-child(4) { color: #ff8a7a; font-weight: bold; }
	</style>
</head>
<body>
	<header>
		<h1>war2</h1><span id="role">finding the match…</span><a id="invite" target="_blank">open another player ↗</a><span id="summary">starting…</span>
		<details id="status-panel">
			<summary>sync</summary>
			<table id="status">
				<thead><tr><th>client</th><th>team</th><th>view tick</th><th>state</th><th>lag</th><th>keyframes</th><th>gaps</th><th>desyncs</th><th>snaps</th><th>batches</th></tr></thead>
				<tbody></tbody>
			</table>
		</details>
	</header>
	<div id="instances"></div>
	<script type="module" src="./src/browser/play.ts"></script>
</body>
</html>
